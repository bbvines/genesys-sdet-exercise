name: CI — Test, Security & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  test:
    name: TestNG Suite (headless Chrome)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Scenario 2 (API) + Scenario 1 (UI) — Run TestNG suite
        run: mvn test -B --no-transfer-progress -Dheadless=true

      - name: Install Groovy
        run: sudo apt-get install -y groovy

      - name: Scenario 3 (Groovy) — Run Environment Config script
        run: groovy scripts/EnvironmentConfig.groovy

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7


      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 7

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: allure-report

  # ---------------------------------------------------------------------------
  # Job 2: OWASP Dependency-Check (runs in parallel with tests)
  # ---------------------------------------------------------------------------
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: mvn dependency-check:check -B --no-transfer-progress -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true   # NVD down or key issue won't block the build

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3: PMD static analysis (runs in parallel with tests)
  # ---------------------------------------------------------------------------
  static-analysis:
    name: PMD
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: PMD
        run: mvn pmd:pmd pmd:check -B --no-transfer-progress

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pmd-report
          path: target/site/pmd.html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: SonarCloud analysis (runs after tests pass so coverage is available)
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: docker   # wait for all jobs to pass before running Sonar
    if: github.event_name == 'push'   # skip on PRs from forks (no secret access)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history required for blame info

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run tests to generate JaCoCo coverage
        run: mvn test -B --no-transfer-progress -Dheadless=true

      - name: SonarCloud scan
        run: |
          mvn sonar:sonar -B --no-transfer-progress \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.branch.name=main

  # ---------------------------------------------------------------------------
  # Job 5: Docker — build image and run tests inside container
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: owasp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t genesys-sdet-exercise .

      - name: Run tests in Docker container
        run: docker run --rm genesys-sdet-exercise
