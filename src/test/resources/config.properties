# All values here can be overridden at runtime with -Dkey=value
# e.g. mvn test -Dbrowser=firefox -Dheadless=true

# Browser settings
browser=chrome
headless=false

# URLs
base.url=https://developer.genesys.cloud
api.explorer.url=https://developer.genesys.cloud/devapps/api-explorer
swagger.url=https://api.mypurecloud.com/api/v2/docs/swagger

# Timeouts (seconds)
page.load.timeout=60
explicit.wait.timeout=30
api.request.timeout=120

# Security
hsts.min.max.age=31536000

# OWASP fail threshold (CVSS score)
owasp.fail.cvss=8
